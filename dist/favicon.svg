<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Squircle background: #0b0b0b with subtle burnt-orange border -->
  <rect width="506" height="506" x="3" y="3" rx="112" fill="#0b0b0b"/>
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="#c96b32" stroke-width="6" stroke-opacity="0.5"/>

  <!-- ── V glyph — two angled legs meeting at the bottom point ── -->
  <!-- Left leg of V -->
  <polygon
    points="78,118  168,118  256,348  204,348"
    fill="#c96b32"
  />
  <!-- Right leg of V -->
  <polygon
    points="344,118  434,118  308,348  256,348"
    fill="#c96b32"
  />

  <!-- ── Record / disc highlight — the subtle circle-slice in the top-left of the V ── -->
  <!-- Outer disc arc (light grey ring) -->
  <clipPath id="vclip">
    <polygon points="78,118 168,118 256,348 204,348"/>
  </clipPath>
  <g clip-path="url(#vclip)">
    <!-- Full disc shape clipped to only show inside the left V leg -->
    <circle cx="195" cy="152" r="52" fill="none" stroke="#e8e4df" stroke-width="10" opacity="0.28"/>
    <circle cx="195" cy="152" r="30" fill="none" stroke="#e8e4df" stroke-width="7" opacity="0.18"/>
    <!-- Small play-triangle / record label dot -->
    <circle cx="195" cy="152" r="10" fill="#e8e4df" opacity="0.35"/>
    <!-- Tiny play arrow pointing right -->
    <polygon points="190,145 205,152 190,159" fill="#c96b32" opacity="0.9"/>
  </g>
</svg>
