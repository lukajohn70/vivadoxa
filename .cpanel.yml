---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vivadoxa/public_html
    - /bin/mkdir -p $DEPLOYPATH/media/gallery $DEPLOYPATH/media/hero $DEPLOYPATH/media/programs $DEPLOYPATH/media/studio $DEPLOYPATH/media/repairs
    - /bin/cp -R dist/* $DEPLOYPATH/
    - /bin/cp -R api $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/chmod -R 755 $DEPLOYPATH/media
